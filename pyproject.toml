[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-schema-engine"
version = "0.0.4"
description = "A spec-complete, annotation-first JSON Schema engine for Python: interpreter, compiler, formats, every standard output format."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Henry Andrews" },
]
dependencies = ["ecma-regex>=0.1,<0.2"]
keywords = ["json", "json-schema", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
regex = ["regex"]
idna = [
    "idna>=3.7",
]

[project.urls]
Homepage = "https://github.com/handrews/py-json-schema-engine"
Repository = "https://github.com/handrews/py-json-schema-engine"
Issues = "https://github.com/handrews/py-json-schema-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/json_schema_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pyright",
    "import-linter",
    "json-schema-engine-test-kit",
    "json-schema-engine-bench",
    "regex>=2026.9.10",
    "hypothesis>=6.168.0",
    "idna>=3.7",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ecma-regex = { workspace = true }
json-schema-engine-test-kit = { workspace = true }
json-schema-engine-bench = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/test-kit/tests",
    "packages/ecma-regex/tests",
    "packages/bench/tests",
]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "packages/*/src"]
extend-exclude = ["DESIGN.md", "tests/compiler/goldens"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH", "TID", "C4", "PIE", "RET", "N"]
# P5: `exec`/`eval` are banned everywhere but the compiler's one
# instantiation module (the builtin `compile` has no ruff rule; the fences
# test covers it).
extend-select = ["S102", "S307"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S102", "S307"]
"packages/*/tests/**" = ["ANN"]
"src/json_schema_engine/compiler/runtime_compile.py" = ["S102"]

[tool.pyright]
include = ["src", "packages", "tests", "bowtie", "scripts"]
exclude = ["tests/compiler/goldens"]
extraPaths = [
    "src",
    "packages/test-kit/src",
    "packages/ecma-regex/src",
    "packages/bench/src",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_packages = ["json_schema_engine", "ecma_regex"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core never imports compiler"
type = "forbidden"
source_modules = ["json_schema_engine.core"]
forbidden_modules = ["json_schema_engine.compiler"]

[[tool.importlinter.contracts]]
name = "core never uses ast"
type = "forbidden"
source_modules = ["json_schema_engine.core"]
forbidden_modules = ["ast"]

[[tool.importlinter.contracts]]
name = "core never imports test-kit"
type = "forbidden"
source_modules = ["json_schema_engine.core"]
forbidden_modules = ["json_schema_engine.test_kit"]

[[tool.importlinter.contracts]]
name = "core never imports formats"
type = "forbidden"
source_modules = ["json_schema_engine.core"]
forbidden_modules = ["json_schema_engine.formats"]

[[tool.importlinter.contracts]]
name = "compiler never imports formats"
type = "forbidden"
source_modules = ["json_schema_engine.compiler"]
forbidden_modules = ["json_schema_engine.formats"]

[[tool.importlinter.contracts]]
name = "formats never imports compiler or test-kit"
type = "forbidden"
source_modules = ["json_schema_engine.formats"]
forbidden_modules = ["json_schema_engine.compiler", "json_schema_engine.test_kit"]

[[tool.importlinter.contracts]]
name = "compiler never imports test-kit"
type = "forbidden"
source_modules = ["json_schema_engine.compiler"]
forbidden_modules = ["json_schema_engine.test_kit"]

[[tool.importlinter.contracts]]
name = "test-kit never imports the engine"
type = "forbidden"
source_modules = ["json_schema_engine.test_kit"]
forbidden_modules = [
    "json_schema_engine.core",
    "json_schema_engine.compiler",
    "json_schema_engine.formats",
]

[[tool.importlinter.contracts]]
name = "ecma-regex is standalone"
type = "forbidden"
source_modules = ["ecma_regex"]
forbidden_modules = ["json_schema_engine"]
