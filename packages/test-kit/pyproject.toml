[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-schema-engine-test-kit"
version = "0.0.0"
description = "Internal test-support kit for json-schema-engine. Not for external use."
requires-python = ">=3.12"
dependencies = ["pytest>=8"]
classifiers = [
    "Private :: Do Not Upload",
]

[tool.hatch.build.targets.wheel]
packages = ["src/json_schema_engine"]
